<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANS TOPUP - Cek Rekening & E-Wallet</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #cbd5e1;
    }
    select, input {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #0369a1;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
      line-height: 1.6;
    }
    .result.success {
      background-color: #064e3b;
      color: #a7f3d0;
      border: 1px solid #059669;
    }
    .result.error {
      background-color: #7f1d1d;
      color: #fecaca;
      border: 1px solid #dc2626;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Cek Nama Rekening / E-Wallet</h2>
  
  <form id="cekForm">
    <div class="form-group">
      <label for="bankCode">Pilih Bank / E-Wallet</label>
      <select id="bankCode" required>
        <option value="">-- Pilih Provider --</option>
        <optgroup label="Bank">
          <option value="BCA">BCA</option>
          <option value="MANDIRI">Mandiri</option>
          <option value="BRI">BRI</option>
          <option value="BNI">BNI</option>
          <option value="BSI">BSI</option>
          <option value="SEABANK">SeaBank</option>
        </optgroup>
        <optgroup label="E-Wallet">
          <option value="DANA">DANA</option>
          <option value="OVO">OVO</option>
          <option value="GOPAY">GoPay</option>
          <option value="LINKAJA">LinkAja</option>
          <option value="SHOPEEPAY">ShopeePay</option>
        </optgroup>
      </select>
    </div>

    <div class="form-group">
      <label for="accountNumber">Nomor Rekening / No. HP</label>
      <input type="text" id="accountNumber" placeholder="Masukan nomor rekening / HP" required>
    </div>

    <button type="submit" id="btnSubmit">Periksa Sekarang</button>
  </form>

  <div id="resultBox" class="result"></div>
</div>

<script>
  const form = document.getElementById('cekForm');
  const resultBox = document.getElementById('resultBox');
  const btnSubmit = document.getElementById('btnSubmit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const bankCode = document.getElementById('bankCode').value;
    const accountNumber = document.getElementById('accountNumber').value;

    btnSubmit.disabled = true;
    btnSubmit.innerText = 'Memeriksa...';
    resultBox.style.display = 'none';

    try {
      const res = await fetch('/api/cek-rekening', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bankCode, accountNumber })
      });

      const data = await res.json();

      if (data.success) {
        resultBox.className = 'result success';
        resultBox.innerHTML = `✅ <b>Pengecekan Berhasil!</b><br>
          Provider: <b>${data.bankCode}</b><br>
          No. Rekening/HP: <b>${data.accountNumber}</b><br>
          Nama Pemilik: <b>${data.accountHolderName}</b>`;
      } else {
        resultBox.className = 'result error';
        resultBox.innerHTML = `❌ <b>Gagal:</b> ${data.message}`;
      }
    } catch (err) {
      resultBox.className = 'result error';
      resultBox.innerHTML = `❌ <b>Error:</b> Tidak dapat terhubung ke server backend.`;
    } finally {
      resultBox.style.display = 'block';
      btnSubmit.disabled = false;
      btnSubmit.innerText = 'Periksa Sekarang';
    }
  });
</script>

</body>
</html>
